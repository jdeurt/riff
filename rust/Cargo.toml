[package]
name = "riff-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Portable schema-guided fuzz fixture engine"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonschema = { version = "0.61", default-features = false, features = ["arbitrary-precision"] }
rand = "0.9"
rand_chacha = "0.9"
rand_regex = "0.18"
bigdecimal = "0.4"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
percent-encoding = "2"
fancy-regex = "0.20"
fake = { version = "4.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std"] }
saphyr = { version = "0.3", default-features = false }
saphyr-parser = "0.3.3"
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
