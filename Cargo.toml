[workspace]
members = ["rust", "bindings/python", "bindings/javascript"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/jdeurt/riff"

[workspace.dependencies]
riff-core = { path = "rust" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
