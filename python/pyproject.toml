[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "riff"
version = "0.1.0"
description = "Schema-guided fuzz fixtures for API tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "typing-extensions>=4.12,<5",
]

[project.urls]
Repository = "https://github.com/jdeurt/riff"
Documentation = "https://github.com/jdeurt/riff/tree/main/docs"

[project.scripts]
riff = "riff.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "ty>=0.0.24,<1",
  "jsonschema[format]>=4.23,<5",
]

[tool.maturin]
manifest-path = "../bindings/python/Cargo.toml"
python-source = "src"
module-name = "riff._native"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Formatter controls trailing commas.
  "D203", # Use D211: no blank line before class docstrings.
  "D213", # Use D212: docstrings start on their first line.
  "CPY001", # Copyright ownership has not been declared by the repository owner.
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "D", "PLR2004"]
"examples/*.py" = ["S101", "D", "INP001", "PLR2004"]
"src/riff/_native.pyi" = ["PYI021"] # Binding definitions include requested IDE documentation.

[tool.ruff.lint.pylint]
max-args = 9

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ty.rules]
all = "error"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Validate external input and use concrete internal types."
"typing.Any".msg = "Use concrete types."
"typing_extensions.cast".msg = "Validate external input and use concrete internal types."
"typing_extensions.Any".msg = "Use concrete types."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
